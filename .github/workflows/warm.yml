name: Warm ping

# Render's free plan sleeps after 15 minutes without traffic, and the first
# request afterwards takes about a minute. Pinging /health/ (no database
# query) every 14 minutes keeps the service awake during the day.
#
# Paused overnight to stay well inside Render's 750 free instance hours:
# runs 01:00-19:59 UTC, i.e. about 06:30-01:30 IST (~590 hours/month).
# GitHub's scheduler can start runs late, so an occasional cold start is
# still possible.

on:
  schedule:
    - cron: "*/14 1-19 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: warm-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl --fail --silent --show-error --max-time 120 https://connectpilot-api.onrender.com/health/
